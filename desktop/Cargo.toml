[package]
name = "vocivio-core"
version = "0.1.0"
edition = "2021"
description = "Vocivio desktop client core — mic capture → GPU server (/ws/translate) → playback. The Tauri UI wraps this crate next (P1b)."

[[bin]]
name = "vocivio-probe"
path = "src/main.rs"

[lib]
name = "vocivio_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = "0.23"   # to install a process-default CryptoProvider for wss:// (rustls 0.23 won't auto-pick)
futures-util = "0.3"
cpal = "0.15"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
members = ["src-tauri"]
